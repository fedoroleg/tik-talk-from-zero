<app-account-filters />
@if(accounts$ | async; as accounts) {
<app-accounts-list
  infiniteScroll
  [infiniteScrollDistance]="2"
  [infiniteScrollThrottle]="1000"
  (scrolled)="onScroll()"
  [accounts]="accounts"
/>
} @else {
<h2>Загрузка...</h2>
}
