<app-account-filters />
<div
  class="accounts-wrapper"
  waIntersectionObserver
  waIntersectionThreshold="0.2"
>
  @if(accounts$ | async; as accounts){ @for(account of accounts; track
  account.id; let last = $last) {
  <app-account-card
    (waIntersectionObservee)="last ? onIntersection($event) : null"
    [account]="account"
  />
  } } @else {
  <h1>Загрузка...</h1>
  }
</div>
